<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mascotas Salitrera Maria Elena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Registro de Mascotas</h1>
      <p>Uso interno para residentes del condominio Salitrera Maria Elena.</p>

      <section class="card">
        <h2>Nueva mascota</h2>
        <form id="form-mascota">
          <label>
            Nombre
            <input name="nombre" required />
          </label>
          <label>
            Tipo
            <select name="tipo" required>
              <option value="perro">Perro</option>
              <option value="gato">Gato</option>
            </select>
          </label>
          <label>
            Departamento
            <input name="departamento" required />
          </label>
          <label>
            Contacto del dueno
            <input name="contacto" required />
          </label>
          <button type="submit">Registrar</button>
        </form>
        <div id="msg" class="msg"></div>
      </section>

      <section class="card">
        <h2>Mascotas registradas</h2>
        <ul id="lista"></ul>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
