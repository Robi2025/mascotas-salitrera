<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>Mascotas Salitrera</title><link rel="stylesheet" href="styles.css"></head>
<body>
<div id="toast" class="toast"></div>
<section id="authScreen" class="auth-screen">
  <div class="auth-hero"><img src="assets/branding/mascotas-salitrera-icon-v2.png" alt="Logo"><h1>Mascotas Salitrera</h1><p>La comunidad de mascotas del Condominio Salitrera María Elena</p></div>
  <div class="auth-card">
    <div class="auth-tabs"><button data-auth="login" class="active">Ingresar</button><button data-auth="register">Crear cuenta</button></div>
    <form id="loginForm"><label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="10" required></label><button class="primary">Ingresar</button><p class="hint">Después de ingresar verás las mascotas, propietarios, extraviadas y el chat.</p></form>
    <form id="registerForm" class="hidden"><h2>Ficha del residente</h2><label>Nombre completo<input name="name" required minlength="3"></label><div class="row"><label>Torre<select name="tower" required><option value="">Seleccionar</option><option>María Elena</option><option>Alemania</option></select></label><label>Departamento<input name="department" required></label></div><label>Teléfono<input name="phone" type="tel" required></label><label>Correo electrónico<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="10" required></label><label>Foto del residente (opcional)<input name="avatar" type="file" accept="image/*"></label><button class="primary">Crear mi cuenta</button><p class="hint">Usa 10 caracteres, una mayúscula, una minúscula y un número.</p></form>
  </div>
</section>
<div id="app" class="app hidden">
  <header><div><span class="eyebrow">Condominio Salitrera María Elena</span><h1 id="pageTitle">Mascotas</h1></div><button id="profileBtn" class="avatar-btn" aria-label="Mi perfil"></button></header>
  <main id="content"></main>
  <nav id="bottomNav">
    <button data-page="pets" class="active"><span>♡</span>Mascotas</button>
    <button data-page="owners"><span>♙</span>Propietarios</button>
    <button data-page="lost"><span>☺</span>Extraviadas</button>
    <button data-page="chat"><span>◯</span>Chat Vecinos</button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="sheet"><div class="sheet-head"><h2 id="modalTitle"></h2><button id="closeModal">×</button></div><div id="modalBody"></div></div></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
