<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mascotas Salitrera Maria Elena</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="header">
      <div class="header-content">
        <h1>🐾 Mascotas Salitrera María Elena</h1>
        <p class="subtitle">Registro interno para residentes del condominio</p>
      </div>
    </div>

    <main class="container">
      <div class="content-grid">
        <section class="card card-form">
          <div class="card-header">
            <h2>Registrar Nueva Mascota</h2>
            <p class="card-subtitle">Completa los datos de tu mascota</p>
          </div>
          
          <form id="formMascota">
            <div class="form-group">
              <label for="nombre">Nombre de la mascota</label>
              <input id="nombre" placeholder="Ej: Firulais" required />
            </div>
            
            <div class="form-group">
              <label for="tipo">Tipo de mascota</label>
              <select id="tipo" required>
                <option value="">Selecciona una opción</option>
                <option value="perro">Perro 🐕</option>
                <option value="gato">Gato 🐈</option>
              </select>
            </div>

            <div class="form-group">
              <label for="depto">Número de departamento</label>
              <input id="depto" placeholder="Ej: 101" required />
            </div>

            <div class="form-group">
              <label for="contacto">Contacto del dueño</label>
              <input id="contacto" placeholder="Ej: +56 9 1234 5678" required />
            </div>

            <button type="submit" class="btn btn-primary">Guardar Mascota</button>
          </form>
          
          <div id="msg" class="msg"></div>
        </section>

        <section class="card card-list">
          <div class="card-header">
            <h2>Mascotas Registradas</h2>
            <p class="card-subtitle">Listado de todas las mascotas</p>
          </div>
          <ul id="lista" class="pets-list"></ul>
        </section>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
