services:
  - type: web
    name: mascotas-salitrera-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /tmp/mascotas.db
      - key: DATABASE_URL
        sync: false
      - key: SESSION_DAYS
        value: 30
      - key: BOOTSTRAP_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://localhost
